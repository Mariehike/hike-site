<title>Télécharger HIKE</title>
<link rel="canonical" href="https://hikeapp.fr/">
<script>
// Adresse des QR codes du site et des affichettes (06/11/2026) : elle ne change jamais.
// Au lancement, renseigner les deux liens des stores : l'iPhone ira sur l'App Store,
// Android sur Google Play. Tant qu'ils sont vides, tout le monde va sur l'accueil.
var APP_STORE = '';
var GOOGLE_PLAY = '';
var ua = navigator.userAgent || '';
var cible = '/';
if (/iPhone|iPad|iPod/i.test(ua) && APP_STORE) cible = APP_STORE;
else if (/Android/i.test(ua) && GOOGLE_PLAY) cible = GOOGLE_PLAY;
else if (APP_STORE || GOOGLE_PLAY) cible = '/#arrivee';
location.replace(cible);
</script>
<meta http-equiv="refresh" content="1; url=/">
</head>
